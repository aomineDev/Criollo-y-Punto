<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aqui podras ver el apartado de reservaciones">
    <link rel="stylesheet" href="css/styles.css">
    <title>Criollo & Punto | Reservaciones</title>
</head>

<body>
    <header class="headerBar"></header>

    <h2 class="title-1">Reservaciones</h2>

    <div class="reservas container">
        <div class="fila">
            <!-- Columna izquierda -->
            <div class="columna izquierda">
                <!-- Selección de locales -->
                <div class="locales active" id="locales">
                    <p class="parrafo_reserva title-3">SELECCIONE UN LOCAL</p>
                    <button class="op-local" onclick="mostrarFormulario('miraflores')">Miraflores</button>
                    <button class="op-local" onclick="mostrarFormulario('sanisidro')">San Isidro</button>
                    <button class="op-local " onclick="mostrarFormulario('surco')">Surco</button>
                </div>

                <!-- Formulario de reservas -->
                <div class="formulario" id="formulario">
                    <h2 id="titulo-local" class="titulo_local title-4"></h2>

                    <h3 class="titulo_persona title-3">Personas</h3>
                    <select id="personas" class="imput-opc">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                    </select>

                    <h3 class="titulo_hora title-3">Día</h3>
                    <input type="date" id="fecha" class="imput-opc" />

                    <h3 class="titulo_fecha title-3">Selecciona la hora</h3>
                    <div class="horarios">
                        <button class="opciones">12:30 PM</button>
                        <button class="opciones">1:00 PM</button>
                        <button class="opciones">1:30 PM</button>
                        <button class="opciones">2:00 PM</button>
                        <button class="opciones">2:30 PM</button>
                        <button class="opciones">3:00 PM</button>
                        <button class="opciones">3:30 PM</button>
                        <button class="opciones">4:00 PM</button>
                        <button class="opciones">4:30 PM</button>
                    </div>

                    <button class="volver" onclick="volver()">Volver</button>
                    <button id="btn-confirmar" class="confirmar" onclick="irAConfirmacion()"
                        style="display: none;">Confirmar</button>

                </div>
            </div>

            <div class="confirmacion" id="confirmacion">
                <h2>Confirmación de Reserva</h2>
                <p><strong>Local:</strong> <span id="conf-local"></span></p>
                <p><strong>Personas:</strong> <span id="conf-personas"></span></p>
                <p><strong>Fecha:</strong> <span id="conf-fecha"></span></p>
                <p><strong>Hora:</strong> <span id="conf-hora"></span></p>
                <button onclick="enviarReserva()">Enviar Reserva</button>
            </div>

            <!-- Columna derecha -->
            <div class="columna derecha">
                <img src="img/Delivery/Postres/MazamorraMorada.png" alt="Plato" />
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer"></footer>

    <script type="module" src="js/header/main.js"></script>
    <script type="module" src="js/footer/main.js"></script>
    <script src="js/reservaciones/reservaciones.js"></script>

</body>

</html>
