<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aqui podras ver el apartado de reservaciones">
    <link rel="stylesheet" href="css/styles.css">
    <title>Criollo & Punto | Reservaciones</title>
    <script src="js/reservaciones/reservaciones.js"></script>
</head>

<body>


    <header class="headerBar"></header>

    <section>
        <div class="section">
            <div class="section__cotented container">
                <h4 class="person">Personas</h4>

                <div class="people-selector">
                    <div class="people-selector__option" >
                        <input type="radio" name="cantidad-personas" id="person-1" value="1"
                            class="people-selector__input"c>
                        <label for="person-1" class="people-selector__label">1</label>
                    </div>
                    <div class="people-selector__option">
                        <input type="radio" name="cantidad-personas" id="person-2" value="2"
                            class="people-selector__input">
                        <label for="person-2" class="people-selector__label">2</label>
                    </div>
                    <div class="people-selector__option">
                        <input type="radio" name="cantidad-personas" id="person-3" value="3"
                            class="people-selector__input">
                        <label for="person-3" class="people-selector__label">3</label>
                    </div>
                    <div class="people-selector__option">
                        <input type="radio" name="cantidad-personas" id="person-4" value="4"
                            class="people-selector__input">
                        <label for="person-4" class="people-selector__label">4</label>
                    </div>
                    <div class="people-selector__option">
                        <input type="radio" name="cantidad-personas" id="person-5" value="5"
                            class="people-selector__input">
                        <label for="person-5" class="people-selector__label">5</label>
                    </div>
                    <div class="people-selector__option">
                        <input type="radio" name="cantidad-personas" id="person-6" value="6"
                            class="people-selector__input">
                        <label for="person-6" class="people-selector__label">6</label>
                    </div>
                </div>

                <h4 class="date">Fecha</h4>

                <div class="date-selector">
                    <input type="date" id="fecha-evento" name="fecha-evento" class="date-selector__input">
                </div>
                <h4 class="schedules">Horas disponibles</h4>
                <div class="schedules-selector">
                    <div class="schedules-selector-option">
                        <input type="radio" name="horarios" id="10:20" class="schedules-selector-option__input" name="horario-seleccionada">
                        <label for="10:20" class="shedules_selection__label">10:30</label>
                    </div>
                    <div class="schedules-selector-option">
                        <input type="radio"  id="11:30" class="schedules-selector-option__input"name="horario-seleccionada">
                        <label for="11:30" class="shedules_selection__label">11:30</label>
                    </div>
                    <div class="schedules-selector-option">
                        <input type="radio"  id="12:30" class="schedules-selector-option__input" name="horario-seleccionada">
                        <label for="12:30" class="shedules_selection__label">12:30</label>
                    </div>
                    <div class="schedules-selector-option">
                        <input type="radio"  id="1:30" class="schedules-selector-option__input" name="horario-seleccionada">
                        <label for="1:30" class="shedules_selection__label">1:30</label>
                    </div>
                    <div class="schedules-selector-option">
                        <input type="radio" id="2:30" class="schedules-selector-option__input" name="horario-seleccionada">
                        <label for="2:30" class="shedules_selection__label">2:30</label>
                    </div>
                </div>
                <h4 class="personal-information">Informacion personal</h4>

                <div class="personal-information-form">
                    <form class="form" id="formreservaciones">
                        <div>
                            <label>Nombre</label>
                            <input type="text" id="nombre" placeholder="Ingrese sus nombres"
                                class="personal-information__input">
                        </div>
                        <div>
                            <label>Apellidos</label>
                            <input type="text" id="apellido" placeholder="Ingrese su apellido"
                                class="personal-information__input">
                        </div>
                        <div>
                            <label>Email</label>
                            <input type="email" id="email" placeholder="example@gmail.com"
                                class="personal-information__input">
                        </div>
                        <div>
                            <label>Telefono</label>
                            <input type="text" maxlength="9" id="telefono" class="personal-information__input">
                        </div>
                        <div id="errores" class="error-box" style="display: none;"></div>
                        <div class="send-button">
                            <input type="submit" name="botonenviar" id="btnEnviar" value="Enviar"
                                class="send-button__input">
                        </div>
                        <input type="hidden" name="_captcha" value="false">
                    </form>
                    <div id="modalExito" class="modal">
                        <div class="modal-contenido">
                            <h2>¡Formulario enviado!</h2>
                            <p>Gracias por tu reservacion. Nos pondremos en contacto contigo pronto.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>

    <!-- Footer -->
    <footer class="footer"></footer>

    <script type="module" src="js/header/main.js"></script>
    <script type="module" src="js/footer/main.js"></script>

</body>

</html>
