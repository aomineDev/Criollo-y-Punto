<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aqui podras ver el apartado de reservaciones">
    <link rel="stylesheet" href="css/styles.css">
    <title>Criollo & Punto | Reservaciones</title>
</head>

<body>
    <header class="headerBar"></header>

    <div class="reservas container">
        <h2 class="titulo title-1">Reservaciones</h2>

        <div class="fila">
            <!-- Columna izquierda -->
            <div class="columna izquierda">
                <!-- Selección de locales -->
                <div class="locales active" id="locales">
                    <p class="parrafo_reserva title-3">SELECCIONE UN LOCAL</p>
                    <button class="op-local" onclick="mostrarFormulario('Miraflores')">Miraflores</button>
                    <button class="op-local" onclick="mostrarFormulario('Sanisidro')">San Isidro</button>
                    <button class="op-local " onclick="mostrarFormulario('Surco')">Surco</button>
                </div>

                <!-- Formulario de reservas -->
                <div class="formulario" id="formulario">

                    <h2 id="titulo-local" class="titulo_local title-4"></h2>
                    <h3 class="titulo_persona title-3">Personas</h3>
                    <select id="personas" class="imput-opc">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                    </select>

                    <h3 class="titulo_hora title-3">Día</h3>
                    <input type="date" id="fecha" class="imput-opc" />

                    <h3 class="titulo_fecha title-3">Selecciona la hora</h3>
                    <div class="horarios">
                        <button class="opciones">12:30 PM</button>
                        <button class="opciones">1:00 PM</button>
                        <button class="opciones">1:30 PM</button>
                        <button class="opciones">2:00 PM</button>
                        <button class="opciones">2:30 PM</button>
                        <button class="opciones">3:00 PM</button>
                        <button class="opciones">3:30 PM</button>
                        <button class="opciones">4:00 PM</button>
                        <button class="opciones">4:30 PM</button>
                    </div>

                    <button class="volver" onclick="volver()">Volver</button>
                    <button id="btn-confirmar" class="confirmar" onclick="irAConfirmacion()"
                        style="display: none;">Confirmar</button>

                </div>

                <div class="confirmacion" id="confirmacion">
                    <h2 class="confirmacion_reserva">Confirmación de Reserva</h2>
                    <p><strong class="confirmacion_text">Local:</strong> <span id="conf-local"
                            class="local-text"></span></p>
                    <p><strong class="confirmacion_text">Personas:</strong> <span id="conf-personas"
                            class="local-text"></span></p>
                    <p><strong class="confirmacion_text">Fecha:</strong> <span id="conf-fecha"
                            class="local-text"></span></p>
                    <p><strong class="confirmacion_text">Hora:</strong> <span id="conf-hora" class="local-text"></span>
                    </p>
                </div>

                <div class="formu" id="form">
                    <form name="form" id="formContactanos" onsubmit="return validarFormularioDatos()">
                        <div>
                            <label class="formu_label">Nombre</label>
                            <input type="text" id="nombre" class="formu_input" name="nombre">
                        </div>
                        <div>
                            <label class="formu_label">Apellido</label>
                            <input type="text" name="apellido" id="apellido" class="formu_input">
                        </div>
                        <div>
                            <label class="formu_label">Email</label>
                            <input type="email" id="email" class="formu_input" name="email">
                        </div>
                        <div>
                            <label class="formu_label">Telefono</label>
                            <input type="tel" maxlength="9" class="formu_input" id="telefono" name="telefono">
                        </div>

                        <div id="errores" class="error-box" style="display: none;"></div>
                        <button class="input_btn" type="submit">Enviar Reserva</button>
                    </form>
                </div>

                <div id="modal-confirmacion" class="modal">
                    <div class="modal-contenido-reservaciones">
                        <h2> Reserva hecha exitosamente</h2>
                        <p>Nos pondremos en contacto contigo pronto</p>
                        <button onclick="cerrarModal()">Cerrar</button>
                    </div>
                </div>
            </div>



            <!-- Columna derecha -->
            <div class="columna derecha">
                <img src="img/Delivery/Postres/MazamorraMorada.png" alt="Plato" />
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer"></footer>

    <script type="module" src="js/header/main.js"></script>
    <script type="module" src="js/footer/main.js"></script>
    <script src="js/reservaciones/reservaciones.js"></script>

</body>

</html>
