<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Disfruta lo mejor de la cocina criolla gourmet en casa con el servicio de delivery de Criollo y Punto. Rápido, seguro y con el auténtico sabor peruano.">
  <title>Criollo & Punto | Delivery</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="img/logo/logo-blanco.png" type="image/png">
  <script src="https://kit.fontawesome.com/e47c5641ca.js" crossorigin="anonymous"></script>
</head>

<body>

  <header class="headerBar"></header>

  <div class="delivery-final container">
    <div class="delivery-steps delivery-steps__ubicacion">
      <div class="delivery-step active">
        <div class="delivery-step__icon"><i class="fa-solid fa-check"></i></div>
        <p class="delivery-step__text">Información</p>
      </div>
      <div class="delivery-step active">
        <div class="delivery-step__icon">2</div>
        <p class="delivery-step__text">Ubicacion</p>
      </div>
      <div class="delivery-step">
        <div class="delivery-step__icon">3</div>
        <p class="delivery-step__text">Pago</p>
      </div>
    </div>

    <section class="delivery-final-container">
      <form class="delivery-ubicacion-form" autocomplete="off" id="delivery-ubicacion-form">
        <h3 class="delivery-final-form__title title-3">Direccion de entrega</h3>
        <div id="map"></div>
        <div class="delivery-final-form__field delivery-ubicacion-form__field">
          <input type="text" placeholder=" " name="address" id="address" class="delivery-final-form__text" readonly>
          <label for="address" class="delivery-final-form__label">Dirección</label>

          <button type="button" class="delivery-ubicacion-form__current-location" name="currentLocation" title="Ubicación actual"><i class="fa-solid fa-location-dot"></i></button>
        </div>

        <button type="submit" class="delivery-final-form__button">Continuar </button>
      </form>

      <div class="delivery-resume" id="delivery-resume"></div>
    </section>
  </div>

  <footer class="footer"></footer>
  <script type="module" src="js/header/main.js"></script>
  <script type="module" src="js/footer/main.js"></script>
  <script type="module" src="js/delivery-ubicacion/main.js"></script>

  <script src="./js/delivery-ubicacion/map.js"></script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmK9sjZPtxd4TZ0GXDXv5ONqY4_X0zK1o&callback=initMap"></script>

</body>

</html>
