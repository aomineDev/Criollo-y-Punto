<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Conoce la historia, misión y visión de Criollo y Punto, restaurante gourmet de comida criolla en Lima desde 2006. Tradición, calidad y pasión por lo auténtico.">
    <title>Criollo & Punto | Nosotros</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/logo/logo-blanco.png" type="image/png">
    <script src="https://kit.fontawesome.com/e47c5641ca.js" crossorigin="anonymous"></script>
    <script src="script/contactanos.js"> </script>
</head>

<body>

    <header class="headerBar"></header>

    <div class="container">

        <h2 class="title-1">Contactanos</h2>

        <div class="container_columna"> <!-- contenedor de las dos columnas ubicacion y formulario -->

            <div class="columna">
                <iframe class="mapa"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d62433.19035467788!2d-76.98305891611334!3d-12.03839914203564!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c4278da26259%3A0x5e4f469b726f30fa!2sRestaurante%20El%20Huarique%20Criollo!5e0!3m2!1ses-419!2spe!4v1747491569781!5m2!1ses-419!2spe"
                    loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="columna">
                <div class="contact-form">
                    <form name="form" action="" method="post" onsubmit="return validarFormularioContactanos()">
                        <div>
                            <label class="contact-form__label">Nombre</label>
                            <input type="text" id="nombre" placeholder="Ingrese su nombre" class="contact-form__input">
                        </div>
                        <div>
                            <label class="contact-form__label">Email</label>
                            <input type="email" id="email" placeholder="example@gmail.com" class="contact-form__input">
                        </div>
                        <div>
                            <label class="contact-form__label">Mensaje</label>
                            <textarea class="contact-form__mensaje" id="mensaje" maxlength="90"></textarea>
                        </div>
                        <div id="errores" class="error-box" style="display: none;"></div>
                        <div class="send-buttoon">
                            <input type="submit" id="botonenvio" class="send-buttoon__input">
                        </div>
                    </form>
                </div>
            </div>

        </div>

        <div class="premises">

            <h2 class="title-2">Nuestros locales</h2>

            <div class="premises-option">

                <div class="carta1">
                    <div class="premises__locals">
                        <img src="img/contactanos/locales1pre.jpg" alt="Local1">

                    </div>
                    <div class="premises-option__text">
                        <h4>Miraflores</h4>
                        <p>Av. Las manzanas 23</p>
                        <p>8968-8585</p>
                    </div>

                </div>
                <div class="carta1">

                    <div class="premises__locals">
                        <img src="img/contactanos/pexels-igor-starkov-233202-1237070.jpg" alt="local2">
                    </div>

                    <div class="premises-option__text">
                        <h4>San Isidro</h4>
                        <p>Av. Gira</p>
                        <p>1223-1212</p>
                    </div>

                </div>

                <div class="carta1">
                    <div class="premises__locals">
                        <img src="img/contactanos/pexels-mitrofan-pictures-9248323.jpg" alt="local3">
                    </div>

                    <div class="premises-option__text">
                        <h4>Surco</h4>
                        <p>Av. Palmeras</p>
                        <p>1234-3134</p>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->
    <footer class="footer"></footer>

    <script type="module" src="js/header/main.js"></script>
    <script type="module" src="js/footer/main.js"></script>
    
</body>

</html>
