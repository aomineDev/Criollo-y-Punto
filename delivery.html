<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Disfruta lo mejor de la cocina criolla gourmet en casa con el servicio de delivery de Criollo y Punto. Rápido, seguro y con el auténtico sabor peruano.">
  <title>Criollo & Punto | Delivery</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="img/logo/logo-blanco.png" type="image/png">
  <script src="https://kit.fontawesome.com/e47c5641ca.js" crossorigin="anonymous"></script>
</head>

<body>

  <header class="headerBar"></header>

  <section class="delivery container">
    <h1 class="delivery__title title-1">Delivery</h1>

    <div class="delivery__wrapper">
      <form action="#" class="delivery__form" id="delivery-form">
        <input type="checkbox" name="" id="delivery__filter" class="delivery__filter-checkbox">
        <label for="delivery__filter" class="delivery__filter-label">
          Filtros <i class="fa-solid fa-filter"></i>
        </label>
        
        <div class="delivery__form-wrapper">
          <div class="delivery__form-group">
            <label for="search" class="delivery__form-label">Buscar</label>
            <input type="search" name="search" id="search" placeholder="Nombre del plato..."
              class="delivery__form-search">
          </div>
          <div class="delivery__form-group">
            <label for="categories" class="delivery__form-label">Categorias</label>
            <select name="categories" id="categories" class="delivery__form-select">
              <option value="entradas" selected>Entradas</option>
              <option value="sopas" selected>Sopas</option>
              <option value="criollo" selected>Criollo</option>
              <option value="postres" selected>Postres</option>
              <option value="bebidas" selected>Bebidas</option>
            </select>
          </div>
          <div class="delivery__form-group">
            <label for="price" class="delivery__form-label">Rango de precios</label>
            <input type="range" name="price" id="price" class="delivery__form-range">
          </div>
        </div>
      </form>

      <main class="delivery__menu" id="delivery-menu"></main>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">

    <!-- Imagen principal -->
    <div class="footer__kitchen">
      <img class="kitchen" src="img/banner/footer3.png" alt="">
    </div>

    <!-- Contenedor de la informacion -->
    <div class="footer__content">

      <!-- Logo y redes -->
      <div class="content__redes footer__box">
        <a href=""><img src="img/logo/logo-blanco.png" alt=""></a>
        <div class="social-media">
          <a href="https://facebook.com/"><i class="fa-brands fa-square-facebook"></i></a>
          <a href="https://www.instagram.com/"><i class="fa-brands fa-square-instagram"></i></a>
          <a href=""><i class="fa-brands fa-square-x-twitter"></i></a>
          <a href=""><i class="fa-brands fa-tiktok"></i></a>
        </div>
      </div>

      <!-- Contactanos -->
      <div class="content__contact footer__box">
        <h4 class="title-4">Contactanos</h4>
        <p>+51 923745971</p>
        <p>restauranteCriollo&Punto@gmail.com</p>
      </div>

      <!-- Direccion -->
      <div class="content__redes footer__box">
        <h4 class="title-4">Direccion</h4>
        <p>Av. Los manzanos 123</p>
      </div>

      <!-- Horarios de Atención -->
      <div class="content__atention footer__box">
        <h4 class="title-4">Horario de Atención</h4>
        <p>Lunes - Sábado: <br> 3 PM - 10 PM</p>
        <p>Domingo: <br> Cerrado</p>
      </div>

    </div>

  </footer>

  <script type="module" src="js/delivery/delivery.js"></script>
  <script type="module" src="js/header/main.js"></script>

</body>

</html>
