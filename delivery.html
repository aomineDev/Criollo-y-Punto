<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Disfruta lo mejor de la cocina criolla gourmet en casa con el servicio de delivery de Criollo y Punto. Rápido, seguro y con el auténtico sabor peruano.">
  <title>Criollo & Punto | Delivery</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="img/logo/logo-blanco.png" type="image/png">
  <script src="https://kit.fontawesome.com/e47c5641ca.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="delivery-modal" id="delivery-modal"></div>

  <header class="headerBar">

    <!-- Contenedor de la barra de menu-->
    <div class="header__menu">

      <!-- Logo-->
      <a href="index.html" class="header__logo"><img src="img/logo/logo-blanco.png" alt="Punto & Criollo"></a>
      <input type="checkbox" id="menu">
      <label for="menu" class="menu-icon">&#9776;</label>

      <!-- Barra de menu-->
      <nav class="navbar">
        <ul class="navbar__list">
          <li class="navbar__item"><a href="index.html">Inicio</a></li>
          <li class="navbar__item"><a href="menu.html">Menu</a></li>
          <li class="navbar__item"><a href="blog.html">Blog</a></li>
          <li class="navbar__item navbar__item--active"><a href="delivery.html">Delivery</a></li>
          <li class="navbar__item"><a href="contactanos.html">Contactanos</a></li>
          <li class="navbar__item"><a class="header__btn" href="reservaciones.html">Reservaciones</a></li>
        </ul>
      </nav>
    </div>

  </header>

  <section class="delivery container">
    <h1 class="delivery__title title-1">Delivery</h1>

    <div class="delivery__container">
      <form action="#" class="delivery-form" id="delivery-form">
        <input type="checkbox" name="" id="delivery-filter" class="delivery-filter__checkbox">
        <label for="delivery-filter" class="delivery-filter__label">
          Filtros <i class="fa-solid fa-filter"></i>
        </label>
        
        <div class="delivery-form__container">
          <div class="delivery-form__field">
            <label for="delyvery-form-search" class="delivery-form__label">Buscar</label>
            <input type="search" name="search" id="delyvery-form-search" placeholder="Nombre del plato..."
              class="delivery-form__search">
          </div>
          <div class="delivery-form__field">
            <label for="delyvery-form-categories" class="delivery-form__label">Categorias</label>
            <select name="categories" id="delyvery-form-categories" class="delivery-form__select">
              <option value="entradas" selected>Entradas</option>
              <option value="sopas">Sopas</option>
              <option value="criollo">Criollo</option>
              <option value="postres">Postres</option>
              <option value="bebidas">Bebidas</option>
            </select>
          </div>
          <div class="delivery-form__field">
            <label for="delivery-form-range" class="delivery-form__label">Precio Maximo</label>
            <div class="delivery-form__range">
              <input 
                type="range" 
                class="delivery-form__range-input" 
                id="delivery-form-range"
                min="0"
                max="100"
                step="1"
                value="100"
                name="range"
              >

              <div class="delivery-form__range-value" id="delivery-form-range-value">100</div>
            </div>
          </div>
        </div>
      </form>

      <main class="delivery__menu" id="delivery-menu"></main>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">

    <!-- Imagen principal -->
    <div class="footer__kitchen">
      <img class="kitchen" src="img/banner/footer3.png" alt="">
    </div>

    <!-- Contenedor de la informacion -->
    <div class="footer__content">

      <!-- Logo y redes -->
      <div class="content__redes footer__box">
        <a href=""><img src="img/logo/logo-blanco.png" alt=""></a>
        <div class="social-media">
          <a href="https://facebook.com/"><i class="fa-brands fa-square-facebook"></i></a>
          <a href="https://www.instagram.com/"><i class="fa-brands fa-square-instagram"></i></a>
          <a href=""><i class="fa-brands fa-square-x-twitter"></i></a>
          <a href=""><i class="fa-brands fa-tiktok"></i></a>
        </div>
      </div>

      <!-- Contactanos -->
      <div class="content__contact footer__box">
        <h4 class="title-4">Contactanos</h4>
        <p>+51 923745971</p>
        <p>restauranteCriollo&Punto@gmail.com</p>
      </div>

      <!-- Direccion -->
      <div class="content__redes footer__box">
        <h4 class="title-4">Direccion</h4>
        <p>Av. Los manzanos 123</p>
      </div>

      <!-- Horarios de Atención -->
      <div class="content__atention footer__box">
        <h4 class="title-4">Horario de Atención</h4>
        <p>Lunes - Sábado: <br> 3 PM - 10 PM</p>
        <p>Domingo: <br> Cerrado</p>
      </div>

    </div>

  </footer>

  <script type="module" src="js/delivery/delivery.js"></script>

</body>

</html>
